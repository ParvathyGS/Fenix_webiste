{% extends 'sites/base.html' %}

{% block title %}Delete Site — Fenix Homes{% endblock %}

{% block content %}
<div class="container fx-form-wrap">
    <div class="fx-form-card fx-delete-card text-center">
        <i class="bi bi-exclamation-triangle-fill fx-delete-icon"></i>
        <h2>Delete this site?</h2>
        <p class="text-muted">This action can't be undone. You are about to permanently remove:</p>
        <h4 class="fx-delete-name">{{ site.name }}</h4>
        <p class="text-muted mb-4"><i class="bi bi-geo-alt"></i> {{ site.location }}</p>

        <form method="post" class="d-flex justify-content-center gap-2">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger px-4">
                <i class="bi bi-trash me-1"></i> Yes, Delete
            </button>
            <a href="{% url 'list_sites' %}" class="btn btn-outline-navy px-4">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
